name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write # required by dorny/test-reporter to create the check run
    env:
      # Throwaway value for CI only; the app fails fast at startup without it.
      JWT_SECRET: ci-only-dummy-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify

      - name: Publish JUnit results
        uses: dorny/test-reporter@v1
        if: ${{ !cancelled() }}
        with:
          name: JUnit results
          path: target/surefire-reports/TEST-*.xml
          reporter: java-junit
          use-actions-summary: false # create a dedicated check run (with failure annotations)

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 {im+=$4; ic+=$5; bm+=$6; bc+=$7}
              END {
                printf "### JaCoCo coverage\n\n| Metric | Covered | Total | %% |\n|---|---|---|---|\n";
                printf "| Instructions | %d | %d | %.1f |\n", ic, im+ic, (im+ic)?100*ic/(im+ic):0;
                printf "| Branches | %d | %d | %.1f |\n", bc, bm+bc, (bm+bc)?100*bc/(bm+bc):0
              }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test and coverage reports
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 14
